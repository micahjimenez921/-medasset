<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd6c3"/>
      <stop offset="0.6" stop-color="#d6efe4"/>
      <stop offset="1" stop-color="#f4faf6"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ece8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fc7d8"/>
      <stop offset="1" stop-color="#4f93ad"/>
    </linearGradient>
    <pattern id="windows" width="64" height="70" patternUnits="userSpaceOnUse">
      <rect x="12" y="14" width="40" height="40" rx="3" fill="url(#glass)"/>
      <rect x="31" y="14" width="2" height="40" fill="#e3ece8"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- soft clouds -->
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="260" cy="140" rx="120" ry="28"/><ellipse cx="340" cy="120" rx="80" ry="26"/>
    <ellipse cx="1180" cy="190" rx="140" ry="30"/><ellipse cx="1270" cy="168" rx="90" ry="28"/>
    <ellipse cx="760" cy="90" rx="100" ry="22"/>
  </g>
  <!-- hills -->
  <path d="M0 640 C 220 560 420 600 640 570 S 1060 520 1280 570 S 1500 600 1600 560 V 900 H0Z" fill="#7fbf9f" opacity="0.55"/>
  <path d="M0 700 C 260 640 520 690 800 650 S 1280 620 1600 680 V 900 H0Z" fill="#5aa981" opacity="0.6"/>

  <!-- left wing -->
  <rect x="140" y="470" width="420" height="270" fill="url(#wall)"/>
  <rect x="140" y="470" width="420" height="16" fill="#0f5c42"/>
  <rect x="160" y="500" width="384" height="210" fill="url(#windows)"/>
  <!-- right wing -->
  <rect x="1040" y="470" width="420" height="270" fill="url(#wall)"/>
  <rect x="1040" y="470" width="420" height="16" fill="#0f5c42"/>
  <rect x="1056" y="500" width="384" height="210" fill="url(#windows)"/>
  <!-- main tower -->
  <rect x="560" y="300" width="480" height="440" fill="url(#wall)"/>
  <rect x="560" y="300" width="480" height="20" fill="#0f5c42"/>
  <rect x="580" y="340" width="440" height="270" fill="url(#windows)"/>
  <!-- cross sign -->
  <rect x="740" y="236" width="120" height="64" rx="6" fill="#0f5c42"/>
  <rect x="790" y="244" width="20" height="48" fill="#ffffff"/>
  <rect x="776" y="258" width="48" height="20" fill="#ffffff"/>
  <!-- entrance canopy + doors -->
  <rect x="700" y="610" width="200" height="14" fill="#e5a40f"/>
  <rect x="716" y="624" width="168" height="116" fill="#cfe3dc"/>
  <rect x="728" y="636" width="68" height="104" fill="url(#glass)"/>
  <rect x="804" y="636" width="68" height="104" fill="url(#glass)"/>
  <rect x="797" y="636" width="6" height="104" fill="#0f5c42"/>

  <!-- ground & driveway -->
  <rect x="0" y="740" width="1600" height="160" fill="#4f9a74"/>
  <path d="M620 740 H980 L1160 900 H440Z" fill="#c9d6d1"/>
  <path d="M800 745 V900" stroke="#ffffff" stroke-width="6" stroke-dasharray="26 22" opacity="0.8"/>

  <!-- ambulance -->
  <g transform="translate(1110 700)">
    <rect x="0" y="12" width="150" height="62" rx="10" fill="#ffffff"/>
    <path d="M150 28 H190 L214 56 V74 H150Z" fill="#ffffff"/>
    <path d="M158 36 H184 L200 56 H158Z" fill="url(#glass)"/>
    <rect x="0" y="48" width="214" height="10" fill="#0f5c42"/>
    <rect x="50" y="24" width="14" height="30" fill="#c8302e"/><rect x="42" y="32" width="30" height="14" fill="#c8302e"/>
    <rect x="96" y="2" width="30" height="10" rx="3" fill="#e5a40f"/>
    <circle cx="42" cy="78" r="15" fill="#1d2b27"/><circle cx="42" cy="78" r="6" fill="#aab8b3"/>
    <circle cx="170" cy="78" r="15" fill="#1d2b27"/><circle cx="170" cy="78" r="6" fill="#aab8b3"/>
  </g>

  <!-- trees -->
  <g>
    <rect x="76" y="670" width="14" height="80" fill="#5b4a37"/><circle cx="83" cy="640" r="52" fill="#2f7d5a"/><circle cx="56" cy="668" r="34" fill="#3a8c67"/>
    <rect x="1508" y="676" width="14" height="76" fill="#5b4a37"/><circle cx="1515" cy="648" r="48" fill="#2f7d5a"/><circle cx="1540" cy="672" r="32" fill="#3a8c67"/>
    <rect x="590" y="716" width="10" height="40" fill="#5b4a37"/><circle cx="595" cy="700" r="28" fill="#3a8c67"/>
    <rect x="1000" y="716" width="10" height="40" fill="#5b4a37"/><circle cx="1005" cy="700" r="28" fill="#3a8c67"/>
  </g>
</svg>
